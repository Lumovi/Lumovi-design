<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 60 60" width="128" height="128" role="img">
  <title>Lumovi</title>
  <defs>
    <radialGradient id="lumovi-mark-on-dark-intro-l" cx="33" cy="15" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0.553" stop-color="#8cc2ff"/>
      <stop offset="0.76" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </radialGradient>
    <radialGradient id="lumovi-mark-on-dark-intro-orb" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#eff7ff"/>
      <stop offset="0.72" stop-color="#8cc2ff"/>
      <stop offset="1" stop-color="#3987e5"/>
    </radialGradient>
    <radialGradient id="lumovi-mark-on-dark-intro-glow"><stop offset="0" stop-color="#8cc2ff" stop-opacity="0.55"/><stop offset="1" stop-color="#5ea2f0" stop-opacity="0"/></radialGradient>
    <style>
    .lumovi-mark-on-dark-intro-l { animation: lumovi-mark-on-dark-intro-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .lumovi-mark-on-dark-intro-orb { transform-origin: 33px 15px; animation: lumovi-mark-on-dark-intro-light 900ms cubic-bezier(0.16, 1, 0.3, 1) 280ms both; }
    .lumovi-mark-on-dark-intro-glow { transform-origin: 33px 15px; animation: lumovi-mark-on-dark-intro-bloom 1400ms cubic-bezier(0.16, 1, 0.3, 1) 380ms both; }
    @keyframes lumovi-mark-on-dark-intro-rise { from { opacity: 0; transform: translate(-3px, 6px); } }
    @keyframes lumovi-mark-on-dark-intro-light { from { opacity: 0; transform: scale(0.6); } }
    @keyframes lumovi-mark-on-dark-intro-bloom { from { opacity: 0; transform: scale(0.4); } }
    @media (prefers-reduced-motion: reduce) { .lumovi-mark-on-dark-intro-l, .lumovi-mark-on-dark-intro-orb, .lumovi-mark-on-dark-intro-glow { animation: none; } }
    </style>
  </defs>
  <circle class="lumovi-mark-on-dark-intro-glow" cx="33" cy="15" r="21" fill="url(#lumovi-mark-on-dark-intro-glow)"/>
  <path class="lumovi-mark-on-dark-intro-l" d="M0 15V6A6 6 0 0 1 12 6V15A21 21 0 0 0 33 36H42A6 6 0 0 1 42 48H21A21 21 0 0 1 0 27Z" fill="url(#lumovi-mark-on-dark-intro-l)"/>
  <circle class="lumovi-mark-on-dark-intro-orb" cx="33" cy="15" r="15" fill="url(#lumovi-mark-on-dark-intro-orb)"/>
