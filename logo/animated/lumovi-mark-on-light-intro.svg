<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 60 60" width="128" height="128" role="img">
  <title>Lumovi</title>
  <defs>
    <radialGradient id="lumovi-mark-on-light-intro-glow"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <style>
    .lumovi-mark-on-light-intro-shade { transform-origin: 24px 24px; animation: lumovi-mark-on-light-intro-settle 700ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .lumovi-mark-on-light-intro-light { transform-origin: 0px 48px; animation: lumovi-mark-on-light-intro-sweep 900ms cubic-bezier(0.16, 1, 0.3, 1) 250ms both; }
    .lumovi-mark-on-light-intro-glow { transform-origin: 0px 48px; animation: lumovi-mark-on-light-intro-sweep 1200ms cubic-bezier(0.16, 1, 0.3, 1) 350ms both; }
    @keyframes lumovi-mark-on-light-intro-settle { from { opacity: 0; transform: scale(0.94); } }
    @keyframes lumovi-mark-on-light-intro-sweep { from { opacity: 0; transform: scale(0.2); } }
    @media (prefers-reduced-motion: reduce) { .lumovi-mark-on-light-intro-shade, .lumovi-mark-on-light-intro-light, .lumovi-mark-on-light-intro-glow { animation: none; } }
    </style>
  </defs>
  <path class="lumovi-mark-on-light-intro-shade" d="M0 12A12 12 0 0 1 12 0H36A12 12 0 0 1 48 12V36A12 12 0 0 1 36 48A36 36 0 0 0 0 12Z" fill="#d4d4d4"/>
  <path class="lumovi-mark-on-light-intro-light" d="M0 18V36A12 12 0 0 0 12 48H30A30 30 0 0 0 0 18Z" fill="#0a0a0a"/>
