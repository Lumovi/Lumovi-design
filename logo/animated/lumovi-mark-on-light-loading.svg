<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 60 60" width="128" height="128" role="img">
  <title>Lumovi</title>
  <defs>
    <radialGradient id="lumovi-mark-on-light-loading-glow"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <style>
    .lumovi-mark-on-light-loading-light { transform-origin: 0px 48px; animation: lumovi-mark-on-light-loading-breathe 2.2s ease-in-out infinite; }
    .lumovi-mark-on-light-loading-glow { transform-origin: 0px 48px; animation: lumovi-mark-on-light-loading-glow 2.2s ease-in-out infinite; }
    @keyframes lumovi-mark-on-light-loading-breathe { 50% { transform: scale(0.8); } }
    @keyframes lumovi-mark-on-light-loading-glow { 50% { opacity: 0.3; transform: scale(0.8); } }
    @media (prefers-reduced-motion: reduce) { .lumovi-mark-on-light-loading-light, .lumovi-mark-on-light-loading-glow { animation: none; } }
    </style>
  </defs>
  <path class="lumovi-mark-on-light-loading-shade" d="M0 12A12 12 0 0 1 12 0H36A12 12 0 0 1 48 12V36A12 12 0 0 1 36 48A36 36 0 0 0 0 12Z" fill="#d4d4d4"/>
