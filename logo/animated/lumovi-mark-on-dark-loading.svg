<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 60 60" width="128" height="128" role="img">
  <title>Lumovi</title>
  <defs>
    <radialGradient id="lumovi-mark-on-dark-loading-l" cx="33" cy="15" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0.553" stop-color="#8cc2ff"/>
      <stop offset="0.76" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </radialGradient>
    <radialGradient id="lumovi-mark-on-dark-loading-orb" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#eff7ff"/>
      <stop offset="0.72" stop-color="#8cc2ff"/>
      <stop offset="1" stop-color="#3987e5"/>
    </radialGradient>
    <radialGradient id="lumovi-mark-on-dark-loading-glow"><stop offset="0" stop-color="#8cc2ff" stop-opacity="0.55"/><stop offset="1" stop-color="#5ea2f0" stop-opacity="0"/></radialGradient>
    <style>
    .lumovi-mark-on-dark-loading-orb { transform-origin: 33px 15px; animation: lumovi-mark-on-dark-loading-breathe 2.2s ease-in-out infinite; }
    .lumovi-mark-on-dark-loading-glow { transform-origin: 33px 15px; animation: lumovi-mark-on-dark-loading-glow 2.2s ease-in-out infinite; }
    @keyframes lumovi-mark-on-dark-loading-breathe { 50% { transform: scale(0.86); } }
    @keyframes lumovi-mark-on-dark-loading-glow { 50% { opacity: 0.25; transform: scale(0.8); } }
    @media (prefers-reduced-motion: reduce) { .lumovi-mark-on-dark-loading-orb, .lumovi-mark-on-dark-loading-glow { animation: none; } }
